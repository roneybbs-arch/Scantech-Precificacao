<title>Simulador de Precificação</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<style>
  :root {
    --bg: #EEF1EF;
    --surface: #FFFFFF;
    --ink: #16302B;
    --ink-soft: #5C6E69;
    --line: #DCE3DF;
    --brand: #1F4B43;
    --brand-soft: #E3ECE9;
    --up: #2F7D4F;
    --up-soft: #E5F3EA;
    --down: #B23A2E;
    --down-soft: #FBEAE8;
    --zone-atual: #EFF1F3;
    --zone-atual-label: #5B6470;
    --zone-novo: #E3ECE9;
    --zone-novo-label: #1F4B43;
    --zone-mercado: #F4EEDD;
    --zone-mercado-label: #8A6A2F;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  .num { font-variant-numeric: tabular-nums; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; }
  .btn-primary { background: var(--brand); color: #fff; border: none; padding: 10px 18px; border-radius: 8px; font-size: 13.5px; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; }
  .btn-primary:hover { background: #163b34; }
  .btn-primary:disabled { opacity: .45; cursor: not-allowed; }
  .btn-ghost { background: transparent; color: var(--brand); border: 1px solid var(--line); padding: 8px 14px; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
  .btn-ghost:hover { background: var(--brand-soft); }
  .btn-ghost:disabled { opacity: .4; cursor: not-allowed; }
  .link-btn { background: none; border: none; color: var(--brand); font-size: 12.5px; font-weight: 600; cursor: pointer; text-decoration: underline; padding: 0; }
  input, select, textarea { font-family: inherit; }
  .input { border: 1px solid var(--line); border-radius: 8px; background: #fff; color: var(--ink); font-size: 13.5px; padding: 8px 10px; }
  .input:focus { outline: 2px solid var(--brand); outline-offset: 1px; }
  .badge-up { background: var(--up-soft); color: var(--up); padding: 3px 7px; border-radius: 6px; font-size: 11.5px; font-weight: 600; }
  .badge-down { background: var(--down-soft); color: var(--down); padding: 3px 7px; border-radius: 6px; font-size: 11.5px; font-weight: 600; }
  .row-edited { background: #FCF7EC; }
  .msel-item:hover { background: var(--brand-soft); }
  .th { color: var(--ink-soft); font-weight: 600; font-size: 11px; text-transform: uppercase; letter-spacing: .04em; text-align: left; padding: 10px 8px; }
  table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  td { padding: 8px; border-bottom: 1px solid var(--line); }
  thead tr { border-bottom: 1px solid var(--line); }
  .icon { flex-shrink: 0; }
</style>
</head>

  function escapeHtml(s) {
    return String(s == null ? "" : s)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#39;");
  }

  function FORMULA_SUBTEXT(short, full) {
    return '<div title="' + escapeHtml(full) + '" style="font-size:9px;font-weight:400;text-transform:none;letter-spacing:0;color:var(--ink-soft);margin-top:2px;cursor:help;">' + escapeHtml(short) + "</div>";
  }

  /* ------------------------------------------------------------------ */
  /* Data helpers                                                          */
  /* ------------------------------------------------------------------ */

  function normalizeHeader(s) {
    return String(s || "")
      .normalize("NFD")
      .replace(/[\u0300-\u036f]/g, "")
      .toLowerCase()
      .trim()
      .replace(/\s+/g, " ");
  }

  const FIELD_ALIASES = {
    ean: ["ean"],
    codigo: ["produto", "codigo", "cod produto", "codigo produto", "sku"],
    descricao: ["descricao", "produto descricao", "nome do produto"],
    marca: ["marca descricao", "marca-descricao", "marca"],
    dpto: ["dpto", "departamento"],
    setor: ["setor descricao", "setor-descricao", "secao descricao", "secao-descricao", "setor", "secao"],
    grupo: ["grupo descricao", "grupo-descricao", "grupos", "grupo"],
    subgrupo: ["sub grupos descricao", "subgrupo descricao", "sugrupo descricao", "sugrupo-descricao", "sub grupos", "subgrupo", "sub grupo", "sugrupo"],
    volume: ["volume", "qtd", "quantidade"],
    custo: ["custo unitario", "preco fabrica", "custo"],
    precoAtual: ["preco maximo", "preco venda", "preco atual"],
    precoVendaDesconto: ["preco venda"],
    markupAtual: ["markup atual"],
    markdownAtual: ["markdown atual", "mark down atual"],
  };

  function detectColumns(headers) {
    const norm = headers.map(normalizeHeader);
    const map = {};
    Object.keys(FIELD_ALIASES).forEach((field) => {
      const aliases = FIELD_ALIASES[field];
      for (let i = 0; i < aliases.length; i++) {
        const idx = norm.indexOf(aliases[i]);
        if (idx !== -1) { map[field] = headers[idx]; break; }
      }
    });
    return map;
  }

  function toNumber(v) {
    if (typeof v === "number") return v;
    if (v == null || v === "") return 0;
    let s = String(v).trim();
    if (/,\d{1,2}$/.test(s)) s = s.replace(/\./g, "").replace(",", ".");
    else s = s.replace(/,/g, "");
    s = s.replace(/[^\d.-]/g, "");
    const n = parseFloat(s);
    return isNaN(n) ? 0 : n;
  }

  function fmtBRL(n) {
    return (n || 0).toLocaleString("pt-BR", { style: "currency", currency: "BRL" });
  }
  function fmtPct(n, digits) {
    digits = digits == null ? 1 : digits;
    return ((n || 0) * 100).toLocaleString("pt-BR", { minimumFractionDigits: digits, maximumFractionDigits: digits }) + "%";
  }
  function fmtPP(n) {
    const v = (n || 0) * 100;
    const sign = v > 0 ? "+" : "";
    return sign + v.toLocaleString("pt-BR", { minimumFractionDigits: 1, maximumFractionDigits: 1 }) + " p.p.";
  }
  const FONTE_IMPOSTOS_LABELS = {
    xml: { label: "XML", title: "Alíquota/regime vindos do XML da nota fiscal", color: "var(--up)" },
    cadastro: { label: "ERP", title: "Alíquota/regime vindos do cadastro do produto no ERP (pode conter erro de parametrização)", color: "var(--ink-soft)" },
    manual: { label: "Manual", title: "Editado manualmente nesta tela", color: "var(--brand)" },
    saida: { label: "Saída", title: "ICMS de saída do cadastro/grupo de saída (icms_saida.csv); sem dado de nota de entrada", color: "var(--ink-soft)" },
  };
  function fonteImpostosBadgeHtml(fonte) {
    const info = FONTE_IMPOSTOS_LABELS[fonte];
    if (!info) return "";
    return '<span title="' + escapeHtml(info.title) + '" style="display:inline-block;margin-top:3px;font-size:9.5px;font-weight:700;letter-spacing:.03em;color:' + info.color + ';border:1px solid ' + info.color + ';border-radius:3px;padding:1px 4px;">' + info.label + "</span>";
  }
  function fmtDataCompra(s) {
    const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(s || "");
    return m ? m[3] + "/" + m[2] + "/" + m[1] : String(s || "");
  }
  function fmtSignedBRL(n) {
    const sign = n > 0 ? "+" : n < 0 ? "−" : "";
    return sign + fmtBRL(Math.abs(n || 0));
  }
  function fmtSignedPct(n) {
    const v = (n || 0) * 100;
    const sign = v > 0 ? "+" : v < 0 ? "−" : "";
    return sign + Math.abs(v).toLocaleString("pt-BR", { minimumFractionDigits: 1, maximumFractionDigits: 1 }) + "%";
  }

  function compBadge(value) {
    if (value == null) return "";
    const cls = value >= 100 ? "badge-up" : "badge-down";
    return '<span class="' + cls + '">' + value.toLocaleString("pt-BR", { minimumFractionDigits: 1, maximumFractionDigits: 1 }) + "%</span>";
  }

  function compHtml(compAtual, compNovo) {
    if (compAtual == null) return '<span style="color:var(--ink-soft);">sem preço de mercado</span>';
    return '<div>Atual: ' + compBadge(compAtual) + "</div>" +
      '<div style="margin-top:3px;">Novo: ' + compBadge(compNovo) + "</div>";
  }

  function roundToEnding(price, ending) {
    if (!price || price <= 0 || ending == null) return price;
    const base = Math.floor(price);
    const candidates = [base + ending, base - 1 + ending, base + 1 + ending].filter((c) => c > 0);
    return candidates.reduce((best, c) => (Math.abs(c - price) < Math.abs(best - price) ? c : best), candidates[0]);
  }

  function buildProduct(row, colMap, idx) {
    const custo = colMap.custo ? toNumber(row[colMap.custo]) : 0;
    const precoAtual = colMap.precoAtual ? toNumber(row[colMap.precoAtual]) : 0;
    const precoVendaDesconto = colMap.precoVendaDesconto ? toNumber(row[colMap.precoVendaDesconto]) : null;
    const markupAtual = colMap.markupAtual ? toNumber(row[colMap.markupAtual]) : custo > 0 ? precoAtual / custo - 1 : 0;
    const markdownAtual = colMap.markdownAtual ? toNumber(row[colMap.markdownAtual]) : precoAtual > 0 ? (precoAtual - custo) / precoAtual : 0;

  function roundBuyerRule(preco, custo) {
    if (custo == null || custo <= 0 || preco == null || preco <= 0) return preco;

    const centavo = Math.round((preco - intPart) * 100) / 100;
    if (centavo <= 0.2) return intPart - 0.01;
    if (centavo <= 0.6) return intPart + 0.49;
    return intPart + 0.99;
  }

  function copyText(text, textareaEl) {
    return new Promise(function (resolve) {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(
          function () { resolve(true); },
          function () { fallback(); }
        );
      } else {
        fallback();
      }
      function fallback() {
        try {
          if (textareaEl) {
            textareaEl.focus();
            textareaEl.select();
            resolve(document.execCommand("copy"));
            return;
          }
        } catch (e) {}
        resolve(false);
      }
    });
  }

  function handleFile(file) {
    state.fileName = file.name;
    const ext = file.name.split(".").pop().toLowerCase();
    if (ext === "csv") {
      file.text().then(function (text) {
        const parsed = Papa.parse(text, { header: true, skipEmptyLines: true });
        processRows(parsed.data);
      }).catch(function () {
        state.error = "Não consegui ler esse arquivo CSV.";
        renderImportError();
      });
    } else {
      file.arrayBuffer().then(function (buf) {
        try {
          const wb = XLSX.read(buf, { type: "array" });
          let bestSheet = wb.SheetNames[0];
          let bestLen = 0;
          wb.SheetNames.forEach(function (name) {
            const json = XLSX.utils.sheet_to_json(wb.Sheets[name], { defval: "" });
            if (json.length > bestLen) { bestLen = json.length; bestSheet = name; }
          });
          const json = XLSX.utils.sheet_to_json(wb.Sheets[bestSheet], { defval: "" });
          processRows(json);
        } catch (e) {
          state.error = "Não consegui ler esse arquivo. Verifique se é um Excel (.xlsx) válido.";
          renderImportError();
        }
      }).catch(function () {
        state.error = "Não consegui ler esse arquivo.";
        renderImportError();
      });
    }
  }

  function getFilteredProducts() {
    const s = state.search.trim().toLowerCase();
    return state.products.filter(function (p) {
      if (state.filterMarca.size && !state.filterMarca.has(p.marca)) return false;
      if (state.filterGrupo.size && !state.filterGrupo.has(p.grupo)) return false;
      if (state.filterSubgrupo.size && !state.filterSubgrupo.has(p.subgrupo)) return false;
      if (state.filterCostUpdated && !p.custoAtualizado) return false;
      if (state.filterZeroOnly && !(p.custo <= 0 || p.precoAtual <= 0)) return false;
      if (state.filterFonte.size && !state.filterFonte.has(p.fonteImpostos || "sem")) return false;
      if (state.filterConsultor === "sem" && p.markupConsultor > 0) return false;
      if (state.filterConsultor === "com" && !(p.markupConsultor > 0)) return false;
      if (state.filterConsultor === "acima" || state.filterConsultor === "abaixo") {
        const d = diffConsultorPP(p);
        if (d == null) return false;
        if (state.filterConsultor === "acima" && !(d >= state.tolConsultor)) return false;
        if (state.filterConsultor === "abaixo" && !(d <= -state.tolConsultor)) return false;
      }
      if (s) {
        const hay = (p.descricao + " " + p.marca + " " + p.codigo + " " + p.ean).toLowerCase();
        if (hay.indexOf(s) === -1) return false;
      }
      return true;
    });
  }

  // Diferença (em pontos percentuais) entre o markup atual do produto e o markup do consultor.
  // Positivo = preço atual acima do recomendado; negativo = abaixo. null se não há markup do consultor.
  // Preço do consultor = custo ATUAL exibido × (1 + markup do consultor). O markup do consultor nunca é alterado.
  function precoConsultorCalcOf(p) {
    return p.markupConsultor > 0 && p.custo > 0 ? p.custo * (1 + p.markupConsultor) : null;
  }
  function diffConsultorPP(p) {
    if (precoConsultorCalcOf(p) == null || !(p.custo > 0)) return null;
    // = markup atual − markup do consultor, ambos sobre o MESMO custo (o exibido na tela)
    return Math.round(((p.precoAtual - precoConsultorCalcOf(p)) / p.custo) * 10000) / 100;
  }

  function uniqueSorted(field) {
    const set = new Set();

  function computeTotals() {
    let cmv = 0, vendaAtual = 0, vendaSim = 0;
    state.products.forEach(function (p) {
      const vol = p.volume || 0;
      cmv += vol * p.custo;
      vendaAtual += vol * p.precoAtual;
      vendaSim += vol * p.novoPreco;
    });
    const hasVolume = state.products.some(function (p) { return p.volume > 0; });
    let markupAtual, markupSim;
    if (hasVolume && cmv > 0) {
      markupAtual = vendaAtual / cmv - 1;
      markupSim = vendaSim / cmv - 1;
    } else {
      const withCusto = state.products.filter(function (p) { return p.custo > 0; });
      markupAtual = withCusto.length ? withCusto.reduce(function (s, p) { return s + (p.precoAtual / p.custo - 1); }, 0) / withCusto.length : 0;
      markupSim = withCusto.length ? withCusto.reduce(function (s, p) { return s + (p.novoPreco / p.custo - 1); }, 0) / withCusto.length : 0;
    }
    const lucroAtual = hasVolume ? vendaAtual - cmv : state.products.reduce(function (s, p) { return s + (p.precoAtual - p.custo); }, 0);
    const lucroSim = hasVolume ? vendaSim - cmv : state.products.reduce(function (s, p) { return s + (p.novoPreco - p.custo); }, 0);
    const withAliquota = state.products.filter(function (p) { return p.aliquota != null; });
    let lucroRealAtualAvg = null, lucroRealNovoAvg = null, lucroRealPonderado = false, lucroRealBase = 0;
    // Margem ponderada pelo volume vendido: lucro líquido de imposto ÷ faturamento
    // (produtos com alíquota E quantidade vendida). Assim o % anda junto com o R$ do impacto.
    let ponderLucroA = 0, ponderLucroN = 0, ponderFatA = 0, ponderFatN = 0, ponderQtd = 0;
    withAliquota.forEach(function (p) {
      if (!(p.volume > 0)) return;
      const pa = pctLucroReal(p.precoAtual, p.custo, p.aliquota, p.regimePisCofins);
      const pn = pctLucroReal(p.novoPreco, p.custo, p.aliquota, p.regimePisCofins);
      if (pa == null || pn == null) return;
      ponderLucroA += pa * p.precoAtual * p.volume;
      ponderLucroN += pn * p.novoPreco * p.volume;
      ponderFatA += p.precoAtual * p.volume;
      ponderFatN += p.novoPreco * p.volume;
      ponderQtd++;
    });
    if (ponderQtd > 0 && ponderFatA > 0 && ponderFatN > 0) {
      lucroRealAtualAvg = ponderLucroA / ponderFatA;
      lucroRealNovoAvg = ponderLucroN / ponderFatN;
      lucroRealPonderado = true;
      lucroRealBase = ponderQtd;
    } else if (withAliquota.length) {
      let sumA = 0, sumN = 0;
      withAliquota.forEach(function (p) {
        sumA += pctLucroReal(p.precoAtual, p.custo, p.aliquota, p.regimePisCofins) || 0;
        sumN += pctLucroReal(p.novoPreco, p.custo, p.aliquota, p.regimePisCofins) || 0;
      });
      lucroRealAtualAvg = sumA / withAliquota.length;
      lucroRealNovoAvg = sumN / withAliquota.length;
      lucroRealBase = withAliquota.length;
    }
    // Projeção de lucro líquido de imposto, ponderada pelas quantidades vendidas
    // (importadas via "Importar vendas"). Só entra aqui quem tem volume > 0 E alíquota informada.
    let lucroProjetadoAtual = 0, lucroProjetadoNovo = 0, produtosComVenda = 0, unidadesConsideradas = 0;
    state.products.forEach(function (p) {
      if (!(p.volume > 0) || p.aliquota == null) return;
      const pctAtual = pctLucroReal(p.precoAtual, p.custo, p.aliquota, p.regimePisCofins);
      const pctNovo = pctLucroReal(p.novoPreco, p.custo, p.aliquota, p.regimePisCofins);
      if (pctAtual == null || pctNovo == null) return;
      lucroProjetadoAtual += pctAtual * p.precoAtual * p.volume;
      lucroProjetadoNovo += pctNovo * p.novoPreco * p.volume;
      produtosComVenda++;
      unidadesConsideradas += p.volume;
    });
    return {
      count: state.products.length,
      editedCount: state.products.filter(function (p) { return p.edited; }).length,
      markupAtual: markupAtual,
      markupSim: markupSim,
      lucroAtual: lucroAtual,
      lucroSim: lucroSim,
      weighted: hasVolume && cmv > 0,
      withAliquotaCount: withAliquota.length,
      lucroRealAtualAvg: lucroRealAtualAvg,
      lucroRealNovoAvg: lucroRealNovoAvg,
      lucroRealPonderado: lucroRealPonderado,
      lucroRealBase: lucroRealBase,
      lucroProjetadoAtual: lucroProjetadoAtual,
      lucroProjetadoNovo: lucroProjetadoNovo,
      produtosComVenda: produtosComVenda,
      unidadesConsideradas: unidadesConsideradas,
    };
  }

  function buildExportCsvContent() {
    // "Só filtrados" exporta exatamente a lista que está na tela (todos os filtros ativos), alterada ou não
    const source = state.exportFiltered
      ? getFilteredProducts()
      : (state.onlyEdited ? state.products.filter(function (p) { return p.edited; }) : state.products);
    const fmt2 = function (n) { return n.toFixed(2).replace(".", ","); };
    const rows = source.map(function (p) {
      const arredondado = applyExportRounding(p.novoPreco, p.custo, state.exportRounding);
      const row = {
        Codigo: p.codigo,
        Descricao: p.descricao,
        EAN: p.ean,
        Custo_Sistema: (p.custoAnterior != null ? p.custoAnterior : p.custo).toFixed(2).replace(".", ","),
        Custo_Atualizado: p.custo.toFixed(2).replace(".", ","),
        Preco_Venda_Novo: p.novoPreco.toFixed(2).replace(".", ","),
        Preco_Venda_Arredondado: arredondado.toFixed(2).replace(".", ","),
      };
      if (state.exportFiltered) {
        const d = diffConsultorPP(p);
        row.Preco_Atual = fmt2(p.precoAtual);
        row.Markup_Atual_pct = fmt2(p.markupAtual * 100);
        row.Preco_Consultor = precoConsultorCalcOf(p) != null ? fmt2(precoConsultorCalcOf(p)) : "";
        row.Markup_Consultor_pct = p.markupConsultor > 0 ? fmt2(p.markupConsultor * 100) : "";
        row.Diferenca_pontos = d != null ? fmt2(d) : "";
      }
      return row;
    });
    return Papa.unparse(rows, { delimiter: ";" });
  }

      state.tolConsultor = isNaN(v) || v < 0 ? 0 : v;
      state.page = 0;
      renderConsultorFilterUI(); renderTable(); renderExportArea();
    });
    renderConsultorFilterUI();
    document.getElementById("exportRoundingSelect").addEventListener("change", function (e) {
      state.exportRounding = e.target.value;
      renderTable();
      renderExportArea();
    });

    // delegated listeners on tbody (survive tbody.innerHTML replacement)
    const tbody = document.getElementById("tbody");
    tbody.addEventListener("input", function (e) {
      const id = e.target.getAttribute("data-id");
      if (id == null) return;
      const pid = parseInt(id, 10);
      if (e.target.matches('[data-role="preco"]')) {
        updateNovoPreco(pid, parseFloat(e.target.value) || 0);
      } else if (e.target.matches('[data-role="novoMarkup"]')) {
        updateNovoMarkup(pid, parseFloat(e.target.value) || 0);
      } else if (e.target.matches('[data-role="novoMarkdown"]')) {
        updateNovoMarkdown(pid, parseFloat(e.target.value) || 0);
      } else if (e.target.matches('[data-role="aliquota"]')) {
        updateAliquota(pid, parseFloat(e.target.value));
      } else if (e.target.matches('[data-role="novoLucroBruto"]')) {
        updateNovoLucroBruto(pid, parseFloat(e.target.value));
      } else if (e.target.matches('[data-role="modaMercado"]')) {
        updateModaMercado(pid, parseFloat(e.target.value));
      }
    });
    tbody.addEventListener("change", function (e) {
      if (e.target.matches('[data-role="select"]')) {
        const pid = parseInt(e.target.getAttribute("data-id"), 10);
        toggleSelect(pid);
      } else if (e.target.matches('[data-role="regimePisCofins"]')) {
        const pid = parseInt(e.target.getAttribute("data-id"), 10);
        updateRegime(pid, e.target.value);
      }
    });
    tbody.addEventListener("click", function (e) {
      const btn = e.target.closest('[data-role="reset-row"]');
      if (btn) {
        const pid = parseInt(btn.getAttribute("data-id"), 10);
        resetRow(pid);
      }
    });
  }

  const MSEL_ALL_LABELS = { marca: "Todas as marcas", grupo: "Todos os grupos", subgrupo: "Todos os subgrupos", fonte: "Todas as fontes" };
  const FONTE_FILTER_LABELS = { xml: "XML (nota fiscal)", cadastro: "ERP (cadastro)", manual: "Editado manualmente", sem: "Sem fonte registrada" };
  const MSEL_LABEL_MAPS = { fonte: FONTE_FILTER_LABELS };
  let mselDelegationBound = false;

  function getMselSet(key) {
    return state["filter" + key.charAt(0).toUpperCase() + key.slice(1)];
  }

  function uniqueFonteValues() {
    const set = new Set();
    state.products.forEach(function (p) { set.add(p.fonteImpostos || "sem"); });
    const order = ["xml", "cadastro", "saida", "manual", "sem"];
    return order.filter(function (v) { return set.has(v); });
  }

  function renderMultiSelect(key, containerId, values, allLabel, labelMap) {
    const container = document.getElementById(containerId);
    if (!container) return;
    if (!values.length) { container.style.display = "none"; return; }
    container.style.cssText = "position:relative;display:inline-block;";
    container.setAttribute("data-msel-key", key);
    const selectedSet = getMselSet(key);
    let optionsHtml = '<label class="msel-item" style="display:flex;align-items:center;gap:8px;padding:5px 6px;cursor:pointer;font-size:13px;border-radius:6px;">' +
      '<input type="checkbox" data-msel-all="' + key + '" ' + (selectedSet.size === 0 ? "checked" : "") + " /> " + escapeHtml(allLabel) + "</label>" +
      '<div style="border-top:1px solid var(--line);margin:4px 0;"></div>';
    values.forEach(function (v) {
      const label = labelMap && labelMap[v] ? labelMap[v] : v;
      optionsHtml += '<label class="msel-item" style="display:flex;align-items:center;gap:8px;padding:5px 6px;cursor:pointer;font-size:13px;border-radius:6px;">' +
        '<input type="checkbox" data-msel-value="' + key + '" value="' + escapeHtml(v) + '" ' + (selectedSet.has(v) ? "checked" : "") + " /> " + escapeHtml(label) + "</label>";
    });
    container.innerHTML =
      '<button type="button" data-msel-toggle="' + key + '" class="input" style="text-align:left;min-width:150px;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:8px;">' +
        '<span data-msel-label="' + key + '"></span><span style="font-size:10px;color:var(--ink-soft);">▾</span>' +
      "</button>" +
      '<div data-msel-panel="' + key + '" class="msel-panel" style="display:none;position:absolute;top:calc(100% + 4px);left:0;z-index:30;background:#fff;border:1px solid var(--line);border-radius:8px;box-shadow:0 6px 18px rgba(0,0,0,.12);max-height:260px;overflow-y:auto;min-width:230px;padding:6px;">' +
        optionsHtml +
      "</div>";
    updateMselLabel(key, labelMap);
  }

  function updateMselLabel(key, labelMap) {
    const labelEl = document.querySelector('[data-msel-label="' + key + '"]');
    if (!labelEl) return;
    const set = getMselSet(key);
    if (set.size === 0) labelEl.textContent = MSEL_ALL_LABELS[key];
    else if (set.size === 1) {
      const v = Array.from(set)[0];
      labelEl.textContent = labelMap && labelMap[v] ? labelMap[v] : v;
    }
    else labelEl.textContent = set.size + " selecionados";
  }

  function ensureMselDelegation() {
    if (mselDelegationBound) return;
    mselDelegationBound = true;
    document.addEventListener("click", function (e) {
      const toggleBtn = e.target.closest("[data-msel-toggle]");
      if (toggleBtn) {
        const key = toggleBtn.getAttribute("data-msel-toggle");
        const panel = document.querySelector('[data-msel-panel="' + key + '"]');
        const isOpen = panel && panel.style.display === "block";
        document.querySelectorAll(".msel-panel").forEach(function (p) { p.style.display = "none"; });
        if (panel) panel.style.display = isOpen ? "none" : "block";
        return;
      }
      if (!e.target.closest(".msel-panel")) {
        document.querySelectorAll(".msel-panel").forEach(function (p) { p.style.display = "none"; });
      }
    });
    document.addEventListener("change", function (e) {
      const allCb = e.target.closest("[data-msel-all]");
      if (allCb) {
        const key = allCb.getAttribute("data-msel-all");
        const set = getMselSet(key);
        set.clear();
        const panel = document.querySelector('[data-msel-panel="' + key + '"]');
        if (panel) panel.querySelectorAll("[data-msel-value]").forEach(function (cb) { cb.checked = false; });
        allCb.checked = true;
        updateMselLabel(key, MSEL_LABEL_MAPS[key]);
        state.page = 0;
        renderTable();
        return;
      }
      const valCb = e.target.closest("[data-msel-value]");
      if (valCb) {
        const key = valCb.getAttribute("data-msel-value");
        const set = getMselSet(key);
        if (valCb.checked) set.add(valCb.value);
        else set.delete(valCb.value);
        const panel = document.querySelector('[data-msel-panel="' + key + '"]');
        const allCbEl = panel && panel.querySelector("[data-msel-all]");
        if (allCbEl) allCbEl.checked = set.size === 0;
        updateMselLabel(key, MSEL_LABEL_MAPS[key]);
        state.page = 0;
        renderTable();
      }
    });
  }

  function updateModeButtons() {
    const markupBtn = document.getElementById("modeMarkup");
    const markdownBtn = document.getElementById("modeMarkdown");
    if (!markupBtn) return;
    const isMarkup = state.mode === "markup";
    markupBtn.style.background = isMarkup ? "var(--brand)" : "transparent";
    markupBtn.style.color = isMarkup ? "#fff" : "var(--brand)";
    markdownBtn.style.background = !isMarkup ? "var(--brand)" : "transparent";
    markdownBtn.style.color = !isMarkup ? "#fff" : "var(--brand)";
  }

  function renderZeroCostWarning() {
    const el = document.getElementById("zeroCostWarning");
    if (!el) return;
    const zeroCount = state.products.filter(function (p) { return p.custo <= 0; }).length;
    if (zeroCount === 0) { el.innerHTML = ""; return; }
    el.innerHTML =
      '<div style="margin-bottom:14px;padding:10px 14px;border-radius:8px;background:var(--down-soft);color:var(--down);font-size:13px;">' +
      "⚠ " + zeroCount + (zeroCount === 1 ? " produto está" : " produtos estão") + " com custo R$ 0,00 — provavelmente sem cadastro completo no ERP ou no arquivo do fornecedor. Vale conferir antes de precificar." +
      "</div>";
  }

  function renderSummary() {
    const totals = computeTotals();
    renderZeroCostWarning();
    const container = document.getElementById("summaryCards");
    if (!container) return;
    const variacao = totals.markupSim - totals.markupAtual;
    const impactUp = totals.lucroSim >= totals.lucroAtual;
    const impactColor = impactUp ? "var(--up)" : "var(--down)";
    container.innerHTML =
      summaryCardHtml("Produtos carregados", totals.count.toLocaleString("pt-BR"), totals.editedCount + " alterados") +
      summaryCardHtml(totals.weighted ? "Markup médio (ponderado)" : "Markup médio (simples)", fmtPct(totals.markupAtual), "Simulado: " + fmtPct(totals.markupSim)) +
      summaryCardHtml("Variação de markup", fmtPP(variacao), null, variacao >= 0 ? "var(--up)" : "var(--down)") +
      '<div class="card" style="padding:14px 16px;">' +
        '<div class="th" style="margin-bottom:6px;">Impacto no lucro' + (totals.weighted ? " (antes de imposto, c/ vendas)" : " (soma simples)") + '</div>' +
        '<div style="display:flex;align-items:center;gap:8px;">' +
          '<span style="color:' + impactColor + ';">' + (impactUp ? ICONS.trendUp : ICONS.trendDown) + "</span>" +
          '<span class="num" style="font-weight:700;font-size:16px;color:' + impactColor + ';">' + fmtBRL(totals.lucroSim - totals.lucroAtual) + "</span>" +
        "</div>" +
        '<div style="margin-top:8px;font-size:11.5px;color:var(--ink-soft);">Atual: ' + fmtBRL(totals.lucroAtual) + " → Simulado: " + fmtBRL(totals.lucroSim) + "</div>" +
      "</div>" +
      (totals.withAliquotaCount > 0
        ? summaryCardHtml(
            totals.lucroRealPonderado ? "Lucro bruto % (ponderado pelas vendas, c/ imposto)" : "Lucro bruto médio simples (c/ imposto)",
            fmtPct(totals.lucroRealAtualAvg),
            "Simulado: " + fmtPct(totals.lucroRealNovoAvg) + " · " +
              (totals.lucroRealPonderado
                ? totals.lucroRealBase + " produtos com venda e alíquota"
                : totals.withAliquotaCount + " de " + totals.count + " com alíquota (sem vendas importadas: média simples)")
          )
        : "") +
      (totals.produtosComVenda > 0 ? (function () {
        const diffProjetado = totals.lucroProjetadoNovo - totals.lucroProjetadoAtual;
        const projUp = diffProjetado >= 0;
        const projColor = projUp ? "var(--up)" : "var(--down)";
        return '<div class="card" style="padding:14px 16px;grid-column:1/-1;border:2px solid ' + projColor + ';">' +
          '<div class="th" style="margin-bottom:6px;">Lucro projetado com base nas vendas importadas</div>' +
          '<div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">' +
            '<span style="color:' + projColor + ';">' + (projUp ? ICONS.trendUp : ICONS.trendDown) + "</span>" +
            '<span class="num" style="font-weight:700;font-size:20px;color:' + projColor + ';">' + fmtSignedBRL(diffProjetado) + "</span>" +
            '<span style="font-size:12.5px;color:var(--ink-soft);">Atual: ' + fmtBRL(totals.lucroProjetadoAtual) + " → Novo: " + fmtBRL(totals.lucroProjetadoNovo) + "</span>" +
          "</div>" +
          '<div style="margin-top:6px;font-size:11.5px;color:var(--ink-soft);">Baseado em ' + totals.unidadesConsideradas.toLocaleString("pt-BR") + " unidades vendidas, em " + totals.produtosComVenda + " produtos com quantidade e alíquota informadas. Assume que o volume de vendas se mantém igual com o preço novo — não considera efeito de elasticidade (o preço mais alto pode reduzir a demanda).</div>" +
        "</div>";
      })() : "");
  }

  function summaryCardHtml(label, value, sub, color) {
    return '<div class="card" style="padding:14px 16px;">' +
      '<div class="th" style="margin-bottom:6px;">' + escapeHtml(label) + "</div>" +
      '<div class="num" style="font-size:19px;font-weight:700;color:' + (color || "var(--ink)") + ';">' + value + "</div>" +
      (sub ? '<div style="font-size:12px;color:var(--ink-soft);margin-top:2px;">' + escapeHtml(sub) + "</div>" : "") +
      "</div>";
  }

  function renderTable() {
    const filtered = getFilteredProducts();
    const pageCount = Math.max(1, Math.ceil(filtered.length / state.pageSize));
    if (state.page > pageCount - 1) state.page = pageCount - 1;
    const start = state.page * state.pageSize;
    const paginated = filtered.slice(start, start + state.pageSize);

    const tbody = document.getElementById("tbody");
    if (paginated.length === 0) {
      tbody.innerHTML = '<tr><td colspan="15" style="padding:28px;text-align:center;color:var(--ink-soft);">Nenhum produto encontrado com esses filtros.</td></tr>';
    } else {
      tbody.innerHTML = paginated.map(rowHtml).join("");
    }

    const rowCountLabel = document.getElementById("rowCountLabel");
    if (rowCountLabel) rowCountLabel.textContent = filtered.length.toLocaleString("pt-BR") + (filtered.length === 1 ? " produto filtrado" : " produtos filtrados");
    const pageLabel = document.getElementById("pageLabel");
    if (pageLabel) pageLabel.textContent = "Página " + (state.page + 1) + " de " + pageCount;
    const prevBtn = document.getElementById("prevPageBtn");
    const nextBtn = document.getElementById("nextPageBtn");
    if (prevBtn) prevBtn.disabled = state.page === 0;
    if (nextBtn) nextBtn.disabled = state.page >= pageCount - 1;

    const selectAllCheckbox = document.getElementById("selectAllCheckbox");
    if (selectAllCheckbox) selectAllCheckbox.checked = filtered.length > 0 && filtered.every(function (p) { return state.selection.has(p.id); });

    updateApplyBulkLabel();
  }

  function rowHtml(p) {
    const novoMarkup = p.custo > 0 ? p.novoPreco / p.custo - 1 : 0;
    const novoMarkdown = p.novoPreco > 0 ? (p.novoPreco - p.custo) / p.novoPreco : 0;
    const varMarkup = novoMarkup - p.markupAtual;
    const varMarkdown = novoMarkdown - p.markdownAtual;
    const subtitle = [p.marca, p.subgrupo || p.grupo, p.codigo ? "Cód. " + p.codigo : ""].filter(Boolean).join(" · ");
    const isZero = p.custo <= 0 || p.precoAtual <= 0;
    const lucroRealAtual = pctLucroReal(p.precoAtual, p.custo, p.aliquota, p.regimePisCofins);
    const lucroRealNovo = pctLucroReal(p.novoPreco, p.custo, p.aliquota, p.regimePisCofins);
    const compAtual = p.precoModaMercado != null && p.precoAtual > 0 ? (p.precoModaMercado / p.precoAtual) * 100 : null;
    const compNovo = p.precoModaMercado != null && p.novoPreco > 0 ? (p.precoModaMercado / p.novoPreco) * 100 : null;
    const precoArredondado = applyExportRounding(p.novoPreco, p.custo, state.exportRounding);
    const lucroFinal = pctLucroReal(precoArredondado, p.custo, p.aliquota, p.regimePisCofins);
    return '<tr id="row-' + p.id + '" class="' + (p.edited ? "row-edited" : "") + '">' +
      '<td><input type="checkbox" data-role="select" data-id="' + p.id + '" ' + (state.selection.has(p.id) ? "checked" : "") + " /></td>" +
      '<td style="max-width:260px;' + (isZero ? "border-left:3px solid var(--down);" : "") + '">' +
        '<div style="font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:260px;">' + escapeHtml(p.descricao) + (isZero ? ' <span class="badge-down" style="margin-left:4px;">⚠ zerado</span>' : "") +
          "</div>" +
        '<div style="font-size:11.5px;color:var(--ink-soft);">' + escapeHtml(subtitle) + (precoConsultorCalcOf(p) != null ? '<span title="Este produto tem markup definido pelo consultor (' + (p.markupConsultor * 100).toFixed(1).replace(".", ",") + '% sobre o custo da planilha)" style="display:inline-block;margin-left:6px;font-size:9.5px;font-weight:700;letter-spacing:.03em;color:var(--brand);border:1px solid var(--brand);border-radius:3px;padding:1px 4px;vertical-align:middle;">CONSULTOR</span>' : "") + "</div>" +
      "</td>" +
      '<td class="num" style="text-align:right;background:var(--zone-atual);">' + fmtBRL(p.custo) + (p.custoAtualizado ? '<div style="font-size:10.5px;color:var(--ink-soft);text-decoration:line-through;">' + fmtBRL(p.custoAnterior) + "</div>" +
        (p.dataCompra ? '<div title="Custo novo: média ponderada das compras dos últimos 3 meses; sem compra recente, o último custo (data da última nota usada)" style="font-size:10px;color:var(--ink-soft);">' + (p.origemCusto === "media_3m" ? "média 3m · até " : "última compra ") + fmtDataCompra(p.dataCompra) + "</div>" : "") : "") + "</td>" +
      '<td class="num" style="text-align:right;background:var(--zone-atual);">' + fmtBRL(p.precoAtual) +
        (p.precoVendaDesconto != null && Math.abs(p.precoVendaDesconto - p.precoAtual) > 0.005
          ? '<div style="font-size:10.5px;color:var(--ink-soft);margin-top:2px;">Venda: ' + fmtBRL(p.precoVendaDesconto) + "</div>"
          : "") +
      "</td>" +
      '<td class="num" style="text-align:right;color:var(--ink-soft);background:var(--zone-atual);">' + fmtPct(p.markupAtual) + (function () {
        const d = diffConsultorPP(p);
        if (d == null) return "";
        const fora = Math.abs(d) >= state.tolConsultor;
        return '<div style="font-size:10.5px;margin-top:2px;color:' + (fora ? "var(--down)" : "var(--ink-soft)") + ';">Consultor: ' + fmtPct(p.markupConsultor) + " (" + (d > 0 ? "+" : d < 0 ? "−" : "") + Math.abs(d).toFixed(1).replace(".", ",") + " pts)</div>";
      })() + "</td>" +
      '<td class="num" style="text-align:right;color:var(--ink-soft);background:var(--zone-atual);">' + fmtPct(p.markdownAtual) + "</td>" +
      '<td style="text-align:right;">' +
        '<input type="number" step="0.1" data-role="aliquota" data-id="' + p.id + '" value="' + (p.aliquota == null ? "" : (p.aliquota * 100).toFixed(1)) + '" placeholder="ICMS %" class="input num" style="width:70px;padding:6px 8px;text-align:right;font-size:13px;" />' +
        '<select data-role="regimePisCofins" data-id="' + p.id + '" class="input" style="display:block;width:100%;margin-top:4px;font-size:10.5px;padding:4px 6px;">' + regimeSelectOptionsHtml(p.regimePisCofins) + "</select>" +
        '<div id="fonte-' + p.id + '" style="text-align:right;">' + fonteImpostosBadgeHtml(p.fonteImpostos) + "</div>" +
      "</td>" +
      '<td style="text-align:right;background:var(--zone-novo);"><input type="number" step="0.1" data-role="novoMarkup" data-id="' + p.id + '" value="' + (novoMarkup * 100).toFixed(1) + '" class="input num" style="width:66px;padding:6px 8px;text-align:right;font-size:13px;" /> <span style="font-size:12px;color:var(--ink-soft);">%</span></td>' +
      '<td style="text-align:right;background:var(--zone-novo);">' +
        '<input type="number" step="0.01" data-role="preco" data-id="' + p.id + '" value="' + p.novoPreco.toFixed(2) + '" class="input num" style="width:90px;padding:6px 8px;text-align:right;font-size:13px;" />' +
        '<div id="round-' + p.id + '" class="num" style="font-size:10.5px;color:var(--ink-soft);margin-top:2px;">→ ' + fmtBRL(precoArredondado) + "</div>" +
      "</td>" +
      '<td id="lb-' + p.id + '" style="text-align:right;font-size:12px;white-space:nowrap;background:var(--zone-novo);">' +
        (lucroRealAtual == null ? '<span style="color:var(--ink-soft);">informe a alíquota</span>' :
          '<div class="num" style="color:var(--ink-soft);">Atual: ' + fmtPct(lucroRealAtual) + "</div>" +
          '<div style="margin-top:3px;display:flex;align-items:center;justify-content:flex-end;gap:3px;">' +
            '<span style="font-weight:600;">Novo:</span>' +
            '<input type="number" step="0.1" data-role="novoLucroBruto" data-id="' + p.id + '" value="' + (lucroRealNovo * 100).toFixed(1) + '" class="input num" style="width:52px;padding:3px 5px;text-align:right;font-size:12px;" /><span>%</span>' +
          "</div>" +
          '<div id="final-' + p.id + '" class="num" style="margin-top:3px;font-weight:600;color:var(--brand);">Final: ' + fmtPct(lucroFinal) + "</div>") +
      "</td>" +
      '<td style="text-align:right;background:var(--zone-novo);"><input type="number" step="0.1" data-role="novoMarkdown" data-id="' + p.id + '" value="' + (novoMarkdown * 100).toFixed(1) + '" class="input num" style="width:66px;padding:6px 8px;text-align:right;font-size:13px;" /> <span style="font-size:12px;color:var(--ink-soft);">%</span></td>' +
      '<td style="text-align:right;background:var(--zone-mercado);"><input type="number" step="0.01" data-role="modaMercado" data-id="' + p.id + '" value="' + (p.precoModaMercado == null ? "" : p.precoModaMercado.toFixed(2)) + '" placeholder="—" class="input num" style="width:74px;padding:6px 8px;text-align:right;font-size:13px;" /></td>' +
      '<td id="comp-' + p.id + '" class="num" style="text-align:right;font-size:12px;white-space:nowrap;background:var(--zone-mercado);">' + compHtml(compAtual, compNovo) + "</td>" +
      '<td style="text-align:right;white-space:nowrap;">' +
        '<div><span class="' + (p.novoPreco - p.precoAtual > 0 ? "badge-down" : "badge-up") + '" title="Variação de preço">Preço ' + fmtSignedBRL(p.novoPreco - p.precoAtual) + " (" + fmtSignedPct(p.precoAtual > 0 ? (p.novoPreco - p.precoAtual) / p.precoAtual : 0) + ")</span></div>" +
        '<div style="margin-top:3px;"><span class="' + (varMarkup >= 0 ? "badge-up" : "badge-down") + '" title="Variação de Markup">Markup ' + fmtPP(varMarkup) + "</span></div>" +
        '<div style="margin-top:3px;"><span class="' + (varMarkdown >= 0 ? "badge-up" : "badge-down") + '" title="Variação de MarkDown">MarkDown ' + fmtPP(varMarkdown) + "</span></div>" +
      "</td>" +
      '<td>' + (p.edited ? '<button data-role="reset-row" data-id="' + p.id + '" title="Desfazer" style="background:none;border:none;cursor:pointer;color:var(--ink-soft);">' + ICONS.x + "</button>" : "") + "</td>" +
      "</tr>";
  }

  function findProduct(id) {
    for (let i = 0; i < state.products.length; i++) if (state.products[i].id === id) return state.products[i];
    return null;
  }

  function patchRow(p, focusRole) {
    const tr = document.getElementById("row-" + p.id);
    if (!tr) return;
    tr.className = p.edited ? "row-edited" : "";
    const novoMarkup = p.custo > 0 ? p.novoPreco / p.custo - 1 : 0;
    const novoMarkdown = p.novoPreco > 0 ? (p.novoPreco - p.custo) / p.novoPreco : 0;
    const varMarkup = novoMarkup - p.markupAtual;
    const varMarkdown = novoMarkdown - p.markdownAtual;
    const lucroRealAtual = pctLucroReal(p.precoAtual, p.custo, p.aliquota, p.regimePisCofins);
    const lucroRealNovo = pctLucroReal(p.novoPreco, p.custo, p.aliquota, p.regimePisCofins);
    const precoArredondado = applyExportRounding(p.novoPreco, p.custo, state.exportRounding);
    const lucroFinal = pctLucroReal(precoArredondado, p.custo, p.aliquota, p.regimePisCofins);

    const precoInput = tr.querySelector('[data-role="preco"]');
    const markupInput = tr.querySelector('[data-role="novoMarkup"]');
    const markdownInput = tr.querySelector('[data-role="novoMarkdown"]');
    const aliquotaInput = tr.querySelector('[data-role="aliquota"]');
    if (focusRole !== "preco") precoInput.value = p.novoPreco.toFixed(2);
    if (focusRole !== "markup") markupInput.value = (novoMarkup * 100).toFixed(1);
    if (focusRole !== "markdown") markdownInput.value = (novoMarkdown * 100).toFixed(1);
    if (focusRole !== "aliquota") aliquotaInput.value = p.aliquota == null ? "" : (p.aliquota * 100).toFixed(1);
    const fonteEl = document.getElementById("fonte-" + p.id);
    if (fonteEl) fonteEl.innerHTML = fonteImpostosBadgeHtml(p.fonteImpostos);
    const roundEl = document.getElementById("round-" + p.id);
    if (roundEl) roundEl.textContent = "→ " + fmtBRL(precoArredondado);

    const lucroRealCell = document.getElementById("lb-" + p.id);
    if (focusRole !== "lucroBruto" && lucroRealCell) {
      lucroRealCell.innerHTML = lucroRealAtual == null ? '<span style="color:var(--ink-soft);">informe a alíquota</span>' :
        '<div class="num" style="color:var(--ink-soft);">Atual: ' + fmtPct(lucroRealAtual) + "</div>" +
        '<div style="margin-top:3px;display:flex;align-items:center;justify-content:flex-end;gap:3px;">' +
          '<span style="font-weight:600;">Novo:</span>' +
          '<input type="number" step="0.1" data-role="novoLucroBruto" data-id="' + p.id + '" value="' + (lucroRealNovo == null ? "" : (lucroRealNovo * 100).toFixed(1)) + '" class="input num" style="width:52px;padding:3px 5px;text-align:right;font-size:12px;" /><span>%</span>' +
        "</div>" +
        '<div id="final-' + p.id + '" class="num" style="margin-top:3px;font-weight:600;color:var(--brand);">Final: ' + fmtPct(lucroFinal) + "</div>";
    }


    const badgeCell = tr.children[13];
    badgeCell.innerHTML =
      '<div><span class="' + (p.novoPreco - p.precoAtual > 0 ? "badge-down" : "badge-up") + '" title="Variação de preço">Preço ' + fmtSignedBRL(p.novoPreco - p.precoAtual) + " (" + fmtSignedPct(p.precoAtual > 0 ? (p.novoPreco - p.precoAtual) / p.precoAtual : 0) + ")</span></div>" +
      '<div style="margin-top:3px;"><span class="' + (varMarkup >= 0 ? "badge-up" : "badge-down") + '" title="Variação de Markup">Markup ' + fmtPP(varMarkup) + "</span></div>" +
      '<div style="margin-top:3px;"><span class="' + (varMarkdown >= 0 ? "badge-up" : "badge-down") + '" title="Variação de MarkDown">MarkDown ' + fmtPP(varMarkdown) + "</span></div>";

    const resetCell = tr.children[14];
    resetCell.innerHTML = p.edited ? '<button data-role="reset-row" data-id="' + p.id + '" title="Desfazer" style="background:none;border:none;cursor:pointer;color:var(--ink-soft);">' + ICONS.x + "</button>" : "";

    const modaInput = tr.querySelector('[data-role="modaMercado"]');
    if (focusRole !== "modaMercado" && modaInput) modaInput.value = p.precoModaMercado == null ? "" : p.precoModaMercado.toFixed(2);
    const compCell = document.getElementById("comp-" + p.id);
    if (compCell) {
      const compAtual = p.precoModaMercado != null && p.precoAtual > 0 ? (p.precoModaMercado / p.precoAtual) * 100 : null;
      const compNovo = p.precoModaMercado != null && p.novoPreco > 0 ? (p.precoModaMercado / p.novoPreco) * 100 : null;
      compCell.innerHTML = compHtml(compAtual, compNovo);
    }

    renderSummary();
    renderExportArea();
  }

  function updateNovoPreco(id, value) {
    const p = findProduct(id);
    if (!p) return;
    p.novoPreco = value;
    p.edited = value !== p.precoAtual;
    patchRow(p, "preco");
  }

  function updateNovoMarkup(id, pctValue) {
    const p = findProduct(id);
    if (!p) return;
    const val = pctValue / 100;
    p.novoPreco = p.custo * (1 + val);
    p.edited = true;
    patchRow(p, "markup");
  }

  function updateNovoMarkdown(id, pctValue) {
    const p = findProduct(id);
    if (!p) return;
    const val = pctValue / 100;
    p.novoPreco = val < 1 ? p.custo / (1 - val) : p.precoAtual;
    p.edited = true;
    patchRow(p, "markdown");
  }

  function updateAliquota(id, pctValue) {
    const p = findProduct(id);
    if (!p) return;
    p.aliquota = isNaN(pctValue) ? null : pctValue / 100;
    p.fonteImpostos = "manual";
    patchRow(p, "aliquota");
  }

  function updateModaMercado(id, value) {
    const p = findProduct(id);
    if (!p) return;
    p.precoModaMercado = isNaN(value) || value <= 0 ? null : value;
    patchRow(p, "modaMercado");
  }

  function solvePrecoFromLucroBruto(custo, aliquota, regimeKey, target) {
    if (aliquota == null) return null;
    const regime = PISCOFINS_REGIMES[regimeKey];
    const saida = regime ? regime.saida : 0;
    const entrada = regime ? regime.entrada : 0;
    const denom = 1 - aliquota - saida - target;
    if (denom <= 0) return null;
    const preco = (custo * (1 - entrada)) / denom;
    if (!isFinite(preco) || preco <= 0) return null;
    return preco;
  }

  function updateNovoLucroBruto(id, pctValue) {
    const p = findProduct(id);
    if (!p || isNaN(pctValue)) return;
    const novoPreco = solvePrecoFromLucroBruto(p.custo, p.aliquota, p.regimePisCofins, pctValue / 100);
    if (novoPreco == null) return;
    p.novoPreco = novoPreco;
    p.edited = true;
    patchRow(p, "lucroBruto");
  }

  function updateRegime(id, value) {
    const p = findProduct(id);
    if (!p) return;
    p.regimePisCofins = value || null;
    p.fonteImpostos = "manual";
    patchRow(p, "regime");
  }

  function resetRow(id) {
    const p = findProduct(id);
    if (!p) return;
    p.novoPreco = p.precoAtual;
    p.edited = false;
    patchRow(p, null);
  }

  function toggleSelect(id) {
    if (state.selection.has(id)) state.selection.delete(id);
    else state.selection.add(id);
    const selectAllCheckbox = document.getElementById("selectAllCheckbox");
    const filtered = getFilteredProducts();
    if (selectAllCheckbox) selectAllCheckbox.checked = filtered.length > 0 && filtered.every(function (p) { return state.selection.has(p.id); });
    updateApplyBulkLabel();
  }

  function toggleSelectAllFiltered() {
    const filtered = getFilteredProducts();
    const allSelected = filtered.every(function (p) { return state.selection.has(p.id); });
    filtered.forEach(function (p) {
      if (allSelected) state.selection.delete(p.id);
      else state.selection.add(p.id);
    });
    renderTable();
  }

  function updateApplyBulkLabel() {
    const btn = document.getElementById("applyBulkBtn");
    if (!btn) return;
    const filtered = getFilteredProducts();
    const count = state.selection.size > 0 ? state.selection.size : filtered.length;
    const suffix = state.selection.size > 0 ? " selecionados" : " (filtrados)";
    btn.textContent = "Aplicar a " + count.toLocaleString("pt-BR") + (count === 1 ? " produto" : " produtos") + suffix;
    btn.disabled = !state.bulkValue;
  }

  function applyBulk() {
    const val = parseFloat(String(state.bulkValue).replace(",", "."));
    if (isNaN(val)) return;
    const filtered = getFilteredProducts();
    const targetIds = state.selection.size > 0 ? state.selection : new Set(filtered.map(function (p) { return p.id; }));
    const ending = state.bulkRounding === "" ? null : parseFloat(state.bulkRounding);
    const v = val / 100;
    state.products.forEach(function (p) {
      if (!targetIds.has(p.id)) return;
      let novoPreco = state.mode === "markup" ? p.custo * (1 + v) : (v < 1 ? p.custo / (1 - v) : p.precoAtual);
      if (ending != null) novoPreco = roundToEnding(novoPreco, ending);
      p.novoPreco = novoPreco;
      p.edited = true;
    });
    renderSummary();
    renderTable();
    renderExportArea();
  }

  function applyAliquotaBulk() {
    const val = parseFloat(String(state.aliquotaBulkValue).replace(",", "."));
    if (isNaN(val)) return;
    const filtered = getFilteredProducts();
    const targetIds = state.selection.size > 0 ? state.selection : new Set(filtered.map(function (p) { return p.id; }));
    const aliquota = val > 1 ? val / 100 : val;
    state.products.forEach(function (p) {
      if (!targetIds.has(p.id)) return;
      p.aliquota = aliquota;
    });
    renderSummary();
    renderTable();
    renderExportArea();
  }

  function applyRegimeBulk() {
    if (!state.regimeBulkValue) return;
    const filtered = getFilteredProducts();
    const targetIds = state.selection.size > 0 ? state.selection : new Set(filtered.map(function (p) { return p.id; }));
    state.products.forEach(function (p) {
      if (!targetIds.has(p.id)) return;
      p.regimePisCofins = state.regimeBulkValue;
    });
    renderSummary();
    renderTable();
    renderExportArea();
  }

  function applyLucroBrutoBulk() {
    const val = parseFloat(String(state.lucroBrutoBulkValue).replace(",", "."));
    if (isNaN(val)) return;
    const target = val / 100;
    const filtered = getFilteredProducts();
    const targetIds = state.selection.size > 0 ? state.selection : new Set(filtered.map(function (p) { return p.id; }));
    let applied = 0, skipped = 0;
    state.products.forEach(function (p) {
      if (!targetIds.has(p.id)) return;
      const novoPreco = solvePrecoFromLucroBruto(p.custo, p.aliquota, p.regimePisCofins, target);
      if (novoPreco == null) { skipped++; return; }
      p.novoPreco = novoPreco;
      p.edited = true;
      applied++;
    });
    const msgEl = document.getElementById("lucroBrutoBulkMsg");
    if (msgEl) {
      msgEl.style.color = skipped > 0 ? "var(--down)" : "var(--up)";
      msgEl.textContent = applied + (applied === 1 ? " produto ajustado" : " produtos ajustados") + (skipped > 0 ? ", " + skipped + " ficaram de fora (sem ICMS informado) — ajuste manualmente" : "") + ".";
    }
    renderSummary();
    renderTable();
    renderExportArea();
  }

  function applyKeepPreviousMargin() {
    const filtered = getFilteredProducts();
    const targetIds = state.selection.size > 0 ? state.selection : new Set(filtered.map(function (p) { return p.id; }));
    state.products.forEach(function (p) {
      if (!targetIds.has(p.id) || !p.custoAtualizado || p.custoAnterior == null) return;
      const margemAnterior = p.custoAnterior > 0 ? p.precoAtual / p.custoAnterior - 1 : 0;
      p.novoPreco = p.custo * (1 + margemAnterior);
      p.edited = true;
    });
    renderSummary();
    renderTable();
    renderExportArea();
  }

  function handleCostFile(file) {
    const ext = file.name.split(".").pop().toLowerCase();
    const msgEl = document.getElementById("costUpdateMsg");
    if (msgEl) { msgEl.style.color = "var(--ink-soft)"; msgEl.textContent = "Lendo arquivo..."; }
    function finish(rows) {
      mergeCostUpdate(rows, function (msg, isError) {
        if (msgEl) {
          msgEl.style.color = isError ? "var(--down)" : "var(--up)";
          msgEl.textContent = msg;
        }
        renderSummary();
        renderTable();
        renderExportArea();
        updateCostUpdateUIVisibility();
      });
    }
    if (ext === "csv") {
      file.text().then(function (text) {
        const parsed = Papa.parse(text, { header: true, skipEmptyLines: true });
        finish(parsed.data);
      }).catch(function () {
        if (msgEl) { msgEl.style.color = "var(--down)"; msgEl.textContent = "Não consegui ler esse arquivo CSV."; }
      });
    } else {
      file.arrayBuffer().then(function (buf) {
        try {
          const wb = XLSX.read(buf, { type: "array" });
          const json = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { defval: "" });
          finish(json);
        } catch (e) {
          if (msgEl) { msgEl.style.color = "var(--down)"; msgEl.textContent = "Não consegui ler esse arquivo."; }
        }
      }).catch(function () {
        if (msgEl) { msgEl.style.color = "var(--down)"; msgEl.textContent = "Não consegui ler esse arquivo."; }
      });
    }
  }

  function autoFetchTaxes() {
    if (!TAXES_DATA_URL && !TAXES_FALLBACK_DATA_URL) return Promise.resolve();
    const msgEl = document.getElementById("nfeMsg");
    if (msgEl) { msgEl.style.color = "var(--ink-soft)"; msgEl.textContent = "Buscando impostos salvos..."; }

  /* ---- ICMS de saída (icms_saida.csv) e markup do consultor (markup_consultor.csv) ---- */
  function findHeaderStartingWith(headers, prefix) {
    for (let i = 0; i < headers.length; i++) {
      if (normalizeHeader(headers[i]).indexOf(prefix) === 0) return headers[i];
    }
    return null;
  }

  function mapProductsByCodigo() {
    const byCodigo = {};
    state.products.forEach(function (p) { if (p.codigo) (byCodigo[p.codigo] = byCodigo[p.codigo] || []).push(p); });
    return byCodigo;
  }

  function mergeIcmsSaida(rows) {
    if (!rows || !rows.length) return { msg: "icms_saida.csv sem linhas.", isError: true };
    const headers = Object.keys(rows[0]);
    const codH = findHeaderStartingWith(headers, "codigo");
    const aliH = findHeaderStartingWith(headers, "aliquota");
    if (!codH || !aliH) return { msg: "icms_saida.csv: não achei as colunas Codigo/Aliquota.", isError: true };
    const byCodigo = mapProductsByCodigo();
    let matched = 0;
    rows.forEach(function (r) {
      const cod = unwrapExcelSafeText(r[codH]);
      const list = byCodigo[cod];
      const raw = r[aliH];
      if (!list || raw == null || String(raw).trim() === "") return;
      const aliq = parseAliquota(raw);
      if (isNaN(aliq)) return;
      list.forEach(function (p) {
        if (p.fonteImpostos === "manual") return;
        p.aliquota = aliq;
        if (!p.fonteImpostos) p.fonteImpostos = "saida";
      });
      matched++;
    });
    return { msg: "ICMS de saída aplicado em " + matched + " produtos", isError: matched === 0 };
  }

  function mergeMarkupConsultor(rows) {
    if (!rows || !rows.length) return { msg: "markup_consultor.csv sem linhas.", isError: true };
    const headers = Object.keys(rows[0]);
    const codH = findHeaderStartingWith(headers, "codigo");
    const mkH = findHeaderStartingWith(headers, "markup");
    const prH = findHeaderStartingWith(headers, "preco");
    if (!codH || !mkH) return { msg: "markup_consultor.csv: não achei as colunas Codigo/Markup.", isError: true };
    const byCodigo = mapProductsByCodigo();
    let matched = 0;
    rows.forEach(function (r) {
      const cod = unwrapExcelSafeText(r[codH]);
      const list = byCodigo[cod];
      const mk = toNumber(r[mkH]);
      if (!list || !(mk > 0)) return;
      list.forEach(function (p) {
        p.markupConsultor = mk / 100;
        if (prH) p.precoConsultor = toNumber(r[prH]);
        // custo-base = custo atual exibido (a planilha do consultor já foi atualizada para o custo novo)
        const base = p.custo;
        if (!(base > 0)) return;
        // preço recomendado pelo consultor (referência fixa para o filtro e o selo)
        p.precoConsultorCalc = base * (1 + p.markupConsultor);
        if (p.edited) return; // não sobrescreve o que o comprador já mexeu
        p.novoPreco = p.precoConsultorCalc;
        p.edited = Math.abs(p.novoPreco - p.precoAtual) > 0.005;
      });
      matched++;
    });
    return { msg: "Markup do consultor aplicado em " + matched + " produtos", isError: matched === 0 };
  }

  function fetchCsvRows(url) {
    return fetch(url, { cache: "no-store" })
      .then(function (resp) {
        if (!resp.ok) throw new Error("HTTP " + resp.status);
        return resp.text();
      })
      .then(function (text) {
        let parsed = Papa.parse(text, { header: true, skipEmptyLines: true, delimiter: ";" });
        if (parsed.meta && parsed.meta.fields && parsed.meta.fields.length < 2) {
          parsed = Papa.parse(text, { header: true, skipEmptyLines: true });
        }
        return parsed.data;
      });
  }

  function autoFetchIcmsSaida() {
    if (!ICMS_SAIDA_DATA_URL) return;
    const msgEl = document.getElementById("nfeMsg");
    fetchCsvRows(ICMS_SAIDA_DATA_URL)
      .then(function (rows) {
        const res = mergeIcmsSaida(rows);
        if (msgEl) {
          msgEl.style.color = res.isError ? "var(--down)" : "var(--up)";
          msgEl.textContent = (msgEl.textContent ? msgEl.textContent + " · " : "") + res.msg;
        }
        renderTable();
        renderSummary();
      })
      .catch(function () {
        if (msgEl) { msgEl.style.color = "var(--down)"; msgEl.textContent += " · Não consegui buscar o ICMS de saída (icms_saida.csv)."; }
      });
  }

  function autoFetchMarkupConsultor() {
    if (!MARKUP_CONSULTOR_DATA_URL) return;
    const msgEl = document.getElementById("markupConsultorMsg");
    if (msgEl) { msgEl.style.color = "var(--ink-soft)"; msgEl.textContent = "Buscando markup do consultor..."; }
    fetchCsvRows(MARKUP_CONSULTOR_DATA_URL)
      .then(function (rows) {
        const res = mergeMarkupConsultor(rows);
        if (msgEl) {
          msgEl.style.color = res.isError ? "var(--down)" : "var(--up)";
          msgEl.textContent = res.msg + " (via GitHub Pages)";
        }
        renderConsultorFilterUI();
        renderTable();
        renderSummary();
        renderExportArea();
      })
      .catch(function () {
        if (msgEl) { msgEl.style.color = "var(--down)"; msgEl.textContent = "Não consegui buscar o markup do consultor (markup_consultor.csv)."; }
      });
  }

  function handleNFeFiles(fileList) {
    const msgEl = document.getElementById("nfeMsg");
    const files = Array.prototype.slice.call(fileList || []);
    if (!files.length) return;
    if (msgEl) { msgEl.style.color = "var(--ink-soft)"; msgEl.textContent = "Lendo " + files.length + " arquivo" + (files.length === 1 ? "" : "s") + "..."; }
    Promise.all(files.map(function (f) {
      return f.text().then(parseNFeXmlText).catch(function () { return null; });
    })).then(function (parsed) {
      const ownInput = document.getElementById("ownCnpjsInput");
      const ownCnpjsRaw = ownInput ? ownInput.value : DEFAULT_OWN_CNPJS.join(", ");
      const ownCnpjs = ownCnpjsRaw.split(",").map(function (s) { return s.trim(); }).filter(Boolean);
      mergeNFeTaxes(parsed, ownCnpjs, function (msg, isError) {
        renderImportResultMsg(msgEl, msg, isError);
        renderTable();
      });
    });
  }

  const QUANTIDADE_ALIASES = ["quantidade", "qtd", "quantidade vendida", "qtd vendida", "volume", "unidades", "unidades vendidas"];

  function mergeVendas(rows, onDone) {
    if (!rows || !rows.length) { onDone("O arquivo não tem linhas de dados.", true); return; }
    const headers = Object.keys(rows[0]);
    const norm = headers.map(normalizeHeader);
    const eanIdx = findAliasIndex(norm, EAN_ALIASES);
    const codigoIdx = norm.indexOf("codigo");
    let qtdIdx = -1;
    for (let i = 0; i < QUANTIDADE_ALIASES.length; i++) {
      const idx = norm.indexOf(QUANTIDADE_ALIASES[i]);
      if (idx !== -1) { qtdIdx = idx; break; }
    }
    if ((eanIdx === -1 && codigoIdx === -1) || qtdIdx === -1) {
      onDone("Não encontrei a coluna de Código/EAN, ou a coluna de Quantidade nesse arquivo.", true);
      return;
    }
    const eanHeader = eanIdx !== -1 ? headers[eanIdx] : null;
    const codigoHeader = codigoIdx !== -1 ? headers[codigoIdx] : null;
    const qtdHeader = headers[qtdIdx];
    const byEan = {}, byCodigo = {};
    state.products.forEach(function (p) {
      if (p.ean) (byEan[p.ean] = byEan[p.ean] || []).push(p);
      if (p.codigo) (byCodigo[p.codigo] = byCodigo[p.codigo] || []).push(p);
    });
    let matched = 0, notFound = 0;
    rows.forEach(function (r) {
      const ean = eanHeader ? unwrapExcelSafeText(r[eanHeader]) : "";
      const codigo = codigoHeader ? unwrapExcelSafeText(r[codigoHeader]) : "";
      const matches = (ean && byEan[ean]) || (codigo && byCodigo[codigo]);
      if (!matches) { if (ean || codigo) notFound++; return; }
      const qtd = toNumber(r[qtdHeader]);
      matches.forEach(function (p) { p.volume = (p.volume || 0) + qtd; });
      matched++;
    });
    let msg = matched + (matched === 1 ? " produto atualizado" : " produtos atualizados") + " com quantidade vendida";
    if (notFound > 0) msg += ", " + notFound + " item" + (notFound === 1 ? "" : "s") + " não encontrado" + (notFound === 1 ? "" : "s") + " na base";
    msg += ".";
    onDone(msg, matched === 0);
  }

  function handleVendasFile(file) {
    const ext = file.name.split(".").pop().toLowerCase();
    const msgEl = document.getElementById("vendasMsg");
    if (msgEl) { msgEl.style.color = "var(--ink-soft)"; msgEl.textContent = "Lendo arquivo..."; }
    function finish(rows) {
      mergeVendas(rows, function (msg, isError) {
        if (msgEl) {
          msgEl.style.color = isError ? "var(--down)" : "var(--up)";
          msgEl.textContent = msg;
        }
        renderTable();
        renderSummary();
      });
    }
    if (ext === "csv") {
      file.text().then(function (text) {
        const parsed = Papa.parse(text, { header: true, skipEmptyLines: true });
        finish(parsed.data);
      }).catch(function () {
        if (msgEl) { msgEl.style.color = "var(--down)"; msgEl.textContent = "Não consegui ler esse arquivo CSV."; }
      });
    } else {
      file.arrayBuffer().then(function (buf) {
        try {
          const wb = XLSX.read(buf, { type: "array" });
          const rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { defval: "" });
          finish(rows);
        } catch (e) {
          if (msgEl) { msgEl.style.color = "var(--down)"; msgEl.textContent = "Não consegui ler esse arquivo."; }
        }
      }).catch(function () {
        if (msgEl) { msgEl.style.color = "var(--down)"; msgEl.textContent = "Não consegui ler esse arquivo."; }
      });
    }
  }

  function handleMarketPriceFile(file) {
    const ext = file.name.split(".").pop().toLowerCase();
    const msgEl = document.getElementById("marketPriceMsg");
    if (msgEl) { msgEl.style.color = "var(--ink-soft)"; msgEl.textContent = "Lendo arquivo..."; }
    function finish(aoa) {
      const rows = smartParseMarketRows(aoa);
      mergeMarketPrice(rows, function (msg, isError) {
        if (msgEl) {
          msgEl.style.color = isError ? "var(--down)" : "var(--up)";
          msgEl.textContent = msg;
        }
        renderTable();
      });
    }
    if (ext === "csv") {
      file.text().then(function (text) {
        const parsed = Papa.parse(text, { header: false, skipEmptyLines: true });
        finish(parsed.data);
      }).catch(function () {
        if (msgEl) { msgEl.style.color = "var(--down)"; msgEl.textContent = "Não consegui ler esse arquivo CSV."; }
      });
    } else {
      file.arrayBuffer().then(function (buf) {
        try {
          const wb = XLSX.read(buf, { type: "array" });
          const aoa = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header: 1, defval: "" });
          finish(aoa);
        } catch (e) {
          if (msgEl) { msgEl.style.color = "var(--down)"; msgEl.textContent = "Não consegui ler esse arquivo."; }
        }
      }).catch(function () {
        if (msgEl) { msgEl.style.color = "var(--down)"; msgEl.textContent = "Não consegui ler esse arquivo."; }
      });
    }
  }

  function updateCostUpdateUIVisibility() {
    const hasCostUpdated = state.products.some(function (p) { return p.custoAtualizado; });
    const wrap = document.getElementById("filterCostUpdatedWrap");
    const keepBtn = document.getElementById("keepMarginBtn");
    if (wrap) wrap.style.display = hasCostUpdated ? "inline-flex" : "none";
    if (keepBtn) keepBtn.style.display = hasCostUpdated ? "inline-flex" : "none";
  }

  function renderExportArea() {
    const container = document.getElementById("exportArea");
    if (!container) return;
    const content = buildExportCsvContent();
    renderDownloadFallback(container, {
      content: content,
      downloadLabel: "Exportar CSV",
      downloadIcon: ICONS.download,
      onDownload: function () {
        triggerDownload("precificacao_simulada_" + new Date().toISOString().slice(0, 10) + ".csv", "\uFEFF" + content, "text/csv;charset=utf-8;");
      },
    });
  }

  /* ------------------------------------------------------------------ */
  /* Boot                                                                  */
  /* ------------------------------------------------------------------ */

  renderImportScreen();
})();
</script>
</body>
